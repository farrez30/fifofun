allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false

# drizzle-kit still pulls the deprecated @esbuild-kit loader, which pins an
# esbuild old enough to carry GHSA-67mh-4wv8-2f99: any website can talk to the
# esbuild dev server and read the response. Nothing here ever runs that server,
# so the advisory is not reachable, but a permanently red audit trains people to
# stop reading audits at all, and that habit is the real risk.
overrides:
  esbuild: '>=0.25.0'
  # eslint's minimatch chain still resolves brace-expansion releases with the
  # recursion and quadratic-time DoS advisories (GHSA, Sep 2026). Lint-time
  # only, never shipped, but kept green for the same reason as esbuild above.
  brace-expansion@1: '^1.1.21'
  brace-expansion@5: '^5.0.12'

patchedDependencies:
  sonner@2.0.8: patches/sonner@2.0.8.patch

# GHSA-vfj7-8cjw-p6xm (braces, Sep 2026) has no fixed release yet: every
# version up to the latest, 3.0.3, is affected, so no override can clear it.
# It sits under eslint-config-next's fast-glob, lint-time only and fed only
# our own glob patterns. Drop this line once braces publishes a fix.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
