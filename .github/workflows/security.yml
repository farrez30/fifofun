name: Security

on:
  push:
    branches: [main]
  pull_request:
    # Draft PRs are skipped; marking one ready for review runs them. `types`
    # replaces the default list, so the defaults are written out.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  schedule:
    # Weekly, because an advisory published today applies to code written months
    # ago and nothing else would re-scan it.
    - cron: '0 3 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # Adds the injection, path traversal and secret-handling queries that
          # the default set leaves out.
          queries: security-extended

      - uses: github/codeql-action/analyze@v4

  secrets:
    name: Secret scan
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks compares against history, so a shallow clone would only ever
          # see the newest commit and miss a key committed last month.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
