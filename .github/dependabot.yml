version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # One pull request per group rather than per package. Twenty separate bumps
    # a week get ignored, which is worse than not knowing.
    groups:
      next:
        patterns: ['next', '@next/*', 'react', 'react-dom', 'eslint-config-next']
      supabase:
        patterns: ['@supabase/*']
      drizzle:
        patterns: ['drizzle-orm', 'drizzle-kit']
      tooling:
        patterns: ['eslint*', 'typescript', 'vitest', '@vitest/*', 'tsx', 'dotenv']
        update-types: ['minor', 'patch']
    ignore:
      # Types follow the runtime, and the runtime is Node 22 (.nvmrc, engines).
      # A newer major types APIs that do not exist when the code actually runs.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore'
